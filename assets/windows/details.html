<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
    <title>Codex 上下文详情</title>
  </head>
  <body class="details-page">
    <main id="details-card" class="details-card">
      <header>
        <strong>上下文窗口</strong>
        <button id="close-details" type="button" aria-label="关闭">×</button>
      </header>
      <section class="headline">
        <strong id="used-percent">—</strong>
        <span id="used-count">等待 Codex 对话</span>
      </section>
      <div class="usage-bar"><span id="usage-fill"></span></div>
      <label class="handoff-toggle">
        <span>自动创建新任务</span>
        <span class="spacer"></span>
        <input id="automatic-handoff-enabled" type="checkbox" checked aria-label="自动创建新任务" />
      </label>
      <div id="metric-rows"></div>
      <footer id="source-label">真实只读数据</footer>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
